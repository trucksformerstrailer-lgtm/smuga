<style>
:root{--bg:#0a0d0c;--panel:#111714;--rule:#26302c;--fg:#ddd6c6;--mut:#8f958c;--amber:#e3a43a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:400 15px/1.5 'JetBrains Mono',ui-monospace,Menlo,monospace}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 48px}
h1{font:400 22px/1.2 'Russo One','Arial Black',sans-serif;letter-spacing:.04em;margin:6px 0 4px}
.lead{color:var(--mut);font-size:12px;margin:0 0 16px}
canvas{display:block;width:100%;height:auto;border:1px solid var(--rule);background:#000}
label{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin:18px 0 6px}
textarea,input{width:100%;background:var(--panel);color:var(--fg);border:1px solid var(--rule);padding:12px;font:400 15px/1.45 inherit;border-radius:0}
textarea{min-height:76px;resize:vertical}
.row{display:flex;gap:8px;margin-top:8px}
.seg button,.act button{flex:1;min-height:46px;border:1px solid #3b4036;background:transparent;color:var(--fg);font:600 13px inherit;cursor:pointer}
.seg button[aria-pressed="true"]{border-color:var(--amber);color:var(--amber)}
.act{margin-top:20px}
.act .pri{background:var(--amber);border-color:var(--amber);color:#15140e}
.hint{font-size:11.5px;color:var(--mut);margin-top:8px}
.ok{color:var(--amber);font-size:12px;min-height:18px;margin-top:8px}
</style>

<script>
const C=document.getElementById('c'),X=C.getContext('2d'),ART=document.getElementById('art');
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const now=new Date();$('date').value=pad(now.getDate())+'.'+pad(now.getMonth()+1)+'.'+now.getFullYear();
let H=1080;
const BG='#0b0d0c',CREAM='#ece3cf',AMB='#e3a43a',MUT='#8f958c';
const DISP="'Russo One','Arial Black',sans-serif",MONO="'JetBrains Mono',ui-monospace,monospace",TEXT="'Literata',Georgia,serif";
function wrap(t,max){const w=t.split(/\s+/).filter(Boolean),out=[];let l='';for(const x of w){const tr=l?l+' '+x:x;if(X.measureText(tr).width>max&&l){out.push(l);l=x}else l=tr}if(l)out.push(l);return out}
function spaced(t,x,y,sp,align){X.save();try{X.letterSpacing=sp+'px'}catch(e){}X.textAlign=align||'left';X.fillText(t,x,y);X.restore()}
function draw(){
  C.width=1080;C.height=H;const W=1080,M=64;
  X.fillStyle=BG;X.fillRect(0,0,W,H);
  const imgH=H-430;
  if(ART.complete&&ART.naturalWidth){const r=Math.max(W/ART.naturalWidth,imgH/ART.naturalHeight),dw=ART.naturalWidth*r,dh=ART.naturalHeight*r;
    X.save();X.beginPath();X.rect(0,0,W,imgH);X.clip();X.drawImage(ART,(W-dw)/2,(imgH-dh)*0.45,dw,dh);X.restore();}
  let g=X.createLinearGradient(0,imgH*0.55,0,imgH+4);g.addColorStop(0,'rgba(11,13,12,0)');g.addColorStop(1,BG);X.fillStyle=g;X.fillRect(0,0,W,imgH+6);
  g=X.createLinearGradient(0,0,0,170);g.addColorStop(0,'rgba(11,13,12,.85)');g.addColorStop(1,'rgba(11,13,12,0)');X.fillStyle=g;X.fillRect(0,0,W,170);
  X.textBaseline='alphabetic';
  X.font='600 22px '+MONO;X.fillStyle=CREAM;spaced('СМУГА · ДВАДЦЯТЬ-П’ЯТДЕСЯТ',M,82,5);
  X.fillStyle=AMB;spaced('20:50',W-M,82,5,'right');
  // title
  let fs=78;X.font=fs+'px '+DISP;while(X.measureText('ДВАДЦЯТЬ-П’ЯТДЕСЯТ').width>W-2*M&&fs>40){fs-=2;X.font=fs+'px '+DISP}
  const line=$('line').value.trim();
  X.font='34px '+TEXT;const L=line?wrap(line,W-2*M).slice(0,3):[];
  const lh=fs*1.08, bodyH=L.length?(22+L.length*48):0;
  let y=H-78-bodyH-lh*2+fs*0.2;
  X.font=fs+'px '+DISP;X.fillStyle=CREAM;X.textAlign='left';X.fillText('ДВАДЦЯТЬ-П’ЯТДЕСЯТ',M,y);
  y+=lh;const a='НА ЗВ’ЯЗКУ. ';X.fillText(a,M,y);X.fillStyle=AMB;X.fillText('ПРИЙОМ.',M+X.measureText(a).width,y);
  y+=22;X.font='34px '+TEXT;X.fillStyle=CREAM;for(const l of L){y+=48;X.fillText(l,M,y)}
  X.font='400 21px '+MONO;X.fillStyle=MUT;spaced(($('date').value||'')+' · 20:50',M,H-46,3);
  spaced('Макс Вишневецький',W-M,H-46,3,'right');
}
function setFmt(h){H=h;$('sq').setAttribute('aria-pressed',h===1080);$('pt').setAttribute('aria-pressed',h===1350);draw()}
$('sq').onclick=()=>setFmt(1080);$('pt').onclick=()=>setFmt(1350);
$('line').oninput=draw;$('date').oninput=draw;
$('dl').onclick=()=>{draw();C.toBlob(b=>{const u=URL.createObjectURL(b),a=document.createElement('a');const d=($('date').value||'').split('.').reverse().join('-');
  a.href=u;a.download='smuha-2050-'+(d||'post')+'.png';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);$('ok').textContent='PNG збережено'},'image/png')};
$('cp').onclick=async()=>{const t='Двадцять-П’ятдесят на зв’язку. Прийом.'+($('line').value.trim()?'\n\n'+$('line').value.trim():'');
  try{await navigator.clipboard.writeText(t);$('ok').textContent='Текст поста скопійовано'}catch(e){window.prompt('Текст поста',t)}};
ART.onload=draw;draw();
if(document.fonts){Promise.all(['78px "Russo One"','600 22px "JetBrains Mono"','34px "Literata"'].map(f=>document.fonts.load(f).catch(()=>{}))).then(draw);document.fonts.ready.then(draw)}
</script>
